services:
  user-db:
    image: postgres:18-alpine
    container_name: c-msuser-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${MSUSER_DB}
    ports:
      - "${MSUSER_PORT}:5432"
    volumes:
      - user_data:/var/lib/postgres/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - digital-library-network

  catalogue-db:
    image: postgres:18-alpine
    container_name: c-mscatalogue-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${MSCATALOGUE_DB}
    ports:
      - "${MSCATALOGUE_PORT}:5432"
    volumes:
      - catalogue_data:/var/lib/postgres/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - digital-library-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: c-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "5050:5050"
    depends_on:
      - user-db
      - catalogue-db
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - digital-library-network

volumes:
  user_data:
  catalogue_data:
  pgadmin_data:

networks:
  digital-library-network: